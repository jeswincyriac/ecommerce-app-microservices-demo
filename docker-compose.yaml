services:
  # Frontend - Web UI
  frontend:
    build:
      context: ./src/frontend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
      - CURRENCY_SERVICE_ADDR=currencyservice:7000
      - CART_SERVICE_ADDR=cartservice:7070
      - RECOMMENDATION_SERVICE_ADDR=recommendationservice:8080
      - CHECKOUT_SERVICE_ADDR=checkoutservice:5050
      - SHIPPING_SERVICE_ADDR=shippingservice:50051
      - AD_SERVICE_ADDR=adservice:9555
      - SHOPPING_ASSISTANT_SERVICE_ADDR=shoppingassistantservice:8080
      - ENABLE_PROFILER=0
    depends_on:
      - productcatalogservice
      - currencyservice
      - cartservice
      - recommendationservice
      - checkoutservice
      - shippingservice
      - adservice

  # Cart Service - C#/.NET
  cartservice:
    build:
      context: ./src/cartservice/src
    platform: linux/amd64
    ports:
      - "7070:7070"
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      - redis

  # Redis - Cart storage
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Product Catalog Service - Go
  productcatalogservice:
    build:
      context: ./src/productcatalogservice
    ports:
      - "3550:3550"
    environment:
      - PORT=3550
      - ENABLE_PROFILER=0

  # Currency Service - Node.js
  currencyservice:
    build:
      context: ./src/currencyservice
    ports:
      - "7000:7000"
    environment:
      - PORT=7000
      - DISABLE_PROFILER=1

  # Recommendation Service - Python
  recommendationservice:
    build:
      context: ./src/recommendationservice
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
      - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
      - ENABLE_PROFILER=0
      - DISABLE_PROFILER=1
    depends_on:
      - productcatalogservice

  # Checkout Service - Go
  checkoutservice:
    build:
      context: ./src/checkoutservice
    ports:
      - "5050:5050"
    environment:
      - PORT=5050
      - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
      - SHIPPING_SERVICE_ADDR=shippingservice:50051
      - PAYMENT_SERVICE_ADDR=paymentservice:50051
      - EMAIL_SERVICE_ADDR=emailservice:8080
      - CURRENCY_SERVICE_ADDR=currencyservice:7000
      - CART_SERVICE_ADDR=cartservice:7070
      - ENABLE_PROFILER=0
    depends_on:
      - productcatalogservice
      - shippingservice
      - paymentservice
      - emailservice
      - currencyservice
      - cartservice

  # Shipping Service - Go
  shippingservice:
    build:
      context: ./src/shippingservice
    ports:
      - "50051:50051"
    environment:
      - PORT=50051
      - ENABLE_PROFILER=0

  # Payment Service - Node.js
  paymentservice:
    build:
      context: ./src/paymentservice
    ports:
      - "50052:50051"
    environment:
      - PORT=50051
      - DISABLE_PROFILER=1

  # Email Service - Python
  emailservice:
    build:
      context: ./src/emailservice
    ports:
      - "8083:8080"
    environment:
      - PORT=8080
      - ENABLE_PROFILER=0
      - DISABLE_PROFILER=1

  # Ad Service - Java
  adservice:
    build:
      context: ./src/adservice
    ports:
      - "9555:9555"
    environment:
      - PORT=9555
      - ENABLE_PROFILER=0

  # Shopping Assistant Service - Python (requires GCP - disabled by default)
  # Uncomment if you have GCP credentials configured
  # shoppingassistantservice:
  #   build:
  #     context: ./src/shoppingassistantservice
  #   ports:
  #     - "8084:8080"
  #   environment:
  #     - PORT=8080
  #     - PROJECT_ID=your-project
  #     - REGION=your-region
  #     - ALLOYDB_DATABASE_NAME=...
  #     - ALLOYDB_TABLE_NAME=...
  #     - ALLOYDB_CLUSTER_NAME=...
  #     - ALLOYDB_INSTANCE_NAME=...
  #     - ALLOYDB_SECRET_NAME=...

  # Load Generator - Python/Locust (optional)
  # loadgenerator:
  #   build:
  #     context: ./src/loadgenerator
  #   environment:
  #     - FRONTEND_ADDR=frontend:8080
  #     - USERS=10
  #   depends_on:
  #     - frontend
